<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern TaskFlow - Todo App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 dark:from-gray-900 dark:via-gray-800 dark:to-slate-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col items-center justify-between font-sans transition-colors duration-300">

    <!-- Main Container -->
    <div class="w-full max-w-2xl mx-auto px-4 py-8 sm:py-12 flex-grow">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">TaskFlow</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Organize your day, achieve your goals.</p>
            </div>
            <button id="theme-toggle" class="p-3 rounded-full bg-white dark:bg-gray-800 shadow-md hover:scale-105 transition-transform text-gray-600 dark:text-yellow-400 focus:outline-none">
                <i class="fa-solid fa-moon dark:hidden text-lg"></i>
                <i class="fa-solid fa-sun hidden dark:inline text-lg"></i>
            </button>
        </header>

        <!-- Input Card -->
        <div class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md rounded-2xl p-6 shadow-xl border border-white/20 dark:border-gray-700/50 mb-8">
            <form id="todo-form" class="space-y-4">
                <div>
                    <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off"
                        class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 text-sm transition-all">
                </div>
                <div class="flex flex-col sm:flex-row gap-3 justify-between items-center">
                    <div class="flex gap-2 w-full sm:w-auto">
                        <!-- Priority Selector -->
                        <select id="todo-priority" class="px-3 py-2 rounded-xl bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="low">Low Priority</option>
                            <option value="medium" selected>Medium Priority</option>
                            <option value="high">High Priority</option>
                        </select>
                        <!-- Due Date Picker -->
                        <input type="date" id="todo-date" class="px-3 py-2 rounded-xl bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-gray-500 dark:text-gray-300">
                    </div>
                    <button type="submit" class="w-full sm:w-auto px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 transition-all flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-plus"></i> Add Task
                    </button>
                </div>
            </form>
        </div>

        <!-- Controls / Filters & Search -->
        <div class="flex flex-col sm:flex-row gap-4 justify-between items-center mb-6">
            <!-- Filter Tabs -->
            <div class="flex bg-white/60 dark:bg-gray-800/60 backdrop-blur-sm p-1 rounded-xl border border-gray-200 dark:border-gray-700 w-full sm:w-auto">
                <button data-filter="all" class="filter-btn flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-semibold transition-all bg-indigo-600 text-white shadow-sm">All</button>
                <button data-filter="active" class="filter-btn flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-semibold transition-all text-gray-600 dark:text-gray-400 hover:text-gray-900">Active</button>
                <button data-filter="completed" class="filter-btn flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-semibold transition-all text-gray-600 dark:text-gray-400 hover:text-gray-900">Completed</button>
            </div>
            <!-- Search Box -->
            <div class="relative w-full sm:w-64">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-search text-xs"></i>
                </span>
                <input type="text" id="search-input" placeholder="Search tasks..." 
                    class="w-full pl-9 pr-4 py-1.5 rounded-xl bg-white/60 dark:bg-gray-800/60 backdrop-blur-sm border border-gray-200 dark:border-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
        </div>

        <!-- Todo List Container -->
        <div class="space-y-3 mb-6" id="todo-list">
            <!-- Dynamic Tasks Go Here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12">
            <div class="inline-flex p-4 rounded-full bg-indigo-50 dark:bg-gray-800 text-indigo-500 mb-3 text-2xl">
                <i class="fa-solid fa-clipboard-check"></i>
            </div>
            <p class="text-gray-500 dark:text-gray-400 text-sm font-medium">No tasks found. Enjoy your free time!</p>
        </div>

        <!-- Footer Stats & Actions -->
        <div class="flex flex-wrap justify-between items-center text-xs text-gray-500 dark:text-gray-400 px-2">
            <span id="task-counter">0 tasks remaining</span>
            <button id="clear-completed" class="hover:text-red-500 transition-colors">Clear Completed</button>
        </div>
    </div>

    <!-- Footer Credit -->
    <footer class="py-4 text-center text-xs text-gray-400 dark:text-gray-600">
        Crafted with modern HTML, Tailwind CSS & JavaScript
    </footer>

    <!-- JavaScript Application Logic Linked -->
    <script src="app.js"></script>
</body>
</html>
